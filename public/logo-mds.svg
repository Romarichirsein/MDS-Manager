<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Ombre subtile -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Arrière-plan bleu marine institutionnel MDS -->
  <rect width="320" height="320" rx="40" fill="#1B365D" />

  <!-- Anneau rouge circulaire médical -->
  <circle cx="160" cy="118" r="62" fill="none" stroke="#E52320" stroke-width="15" />

  <!-- Caducée d'Hermès / Esculape en bleu cyan -->
  <g id="caducee" fill="#00B0FF" stroke="#00B0FF">
    <!-- Tige / Bâton vertical central -->
    <line x1="160" y1="62" x2="160" y2="182" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Sphère / Globe au sommet du bâton -->
    <circle cx="160" cy="60" r="7" stroke-width="2" fill="#00B0FF"/>
    
    <!-- Base arrondie inférieure -->
    <circle cx="160" cy="182" r="3.5" fill="#00B0FF"/>

    <!-- Ailes déployées stylisées -->
    <!-- Aile gauche -->
    <path d="M 157 78 C 142 66, 108 67, 86 85 C 104 98, 126 95, 142 89 C 122 101, 106 109, 98 119 C 114 118, 134 111, 157 99 Z" 
          stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Aile droite -->
    <path d="M 163 78 C 178 66, 212 67, 234 85 C 216 98, 194 95, 178 89 C 198 101, 214 109, 222 119 C 206 118, 186 111, 163 99 Z" 
          stroke-width="1.5" stroke-linejoin="round" />

    <!-- Serpents entrelacés en double hélice -->
    <!-- Courbes serpent gauche -->
    <path d="M 152 86 C 144 94, 144 105, 160 114 C 176 123, 176 134, 160 144 C 144 153, 144 163, 160 172" 
          fill="none" stroke="#00B0FF" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Courbes serpent droit -->
    <path d="M 168 86 C 176 94, 176 105, 160 114 C 144 123, 144 134, 160 144 C 176 153, 176 163, 160 172" 
          fill="none" stroke="#00B0FF" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Têtes des serpents tournées vers l'extérieur -->
    <ellipse cx="149" cy="85" rx="3.5" ry="2.5" transform="rotate(-25 149 85)" fill="#00B0FF"/>
    <ellipse cx="171" cy="85" rx="3.5" ry="2.5" transform="rotate(25 171 85)" fill="#00B0FF"/>
  </g>

  <!-- Typographie Institutionnelle -->
  <!-- Ligne 1 : Centre Médical (Rouge) -->
  <text x="160" y="235" 
        text-anchor="middle" 
        fill="#E52320" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="18.5" 
        font-weight="800" 
        letter-spacing="0.5">Centre Médical</text>

  <!-- Ligne 2 : La Main du Secours (Bleu Cyan) -->
  <text x="160" y="272" 
        text-anchor="middle" 
        fill="#00B0FF" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="-0.2">La Main du Secours</text>
</svg>
